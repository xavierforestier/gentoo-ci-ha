# .github/update-readme.yml
name: Update package list in readme
on:
  workflow_dispatch:
  workflow_call:
env:
  REGISTRY: ghcr.io
  IMAGE_NAME: "xavierforestier/gentoo-ci-ha"
jobs:
  readme:
    name: Update README.md
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/xavierforestier/gentoo-ci-ha:main
      options: --privileged
    steps:
    # synchronys my own git
    - name: Checkout code
      uses: actions/checkout@v7
    - name: Update README
      run: |
        git config --global --add safe.directory /__w/gentoo-ci-ha/gentoo-ci-ha
        git fetch
        git switch main
        emerge -q app-portage/eix app-misc/yq
        eix-update
        cp README.md .header
        head .header -n `grep '## Provided packages' .header -n | cut -d: -f1` > README.md
        rm .header
        # Get category 
        for category in $(EIX_LIMIT=0 eix -I --format '<category>\n' | grep -e '^[^\[].*' | grep -v 'Found' | sort -u | grep -v 'acct-group' | grep -v 'acct-user' ); do
          description=$( cat "/var/db/repos/gentoo/${category}/metadata.xml" | xq '.catmetadata.longdescription[] | select( ."@lang" == "en" )."#text"' | sed 's/\\n/ /g' | sed 's/\\t/ /g' | sed 's/  / /g' | sed 's/  / /g' | sed 's/  / /g' | sed 's/"The .* category contains //g' | sed 's/\."$//g' )
          echo "### ${category}: ${description^}" >> README.md
          EIX_LIMIT=0 NAMEVERSION="\\n   * <version> <use0>" eix -IC ${category} --format '* <category>/<name>: <description> <installedversions:NAMEVERSION>\n' >> README.md
        done        
        git config --local user.name "xavier.forestier"
        git config --local user.email "23277701+xavierforestier@users.noreply.github.com"
        git add README.md
        git commit -m "[CI]Update status" || true
        git push
